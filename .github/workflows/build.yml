name: Build FWJZ Pro Music Dynamic Island

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create Music Island App Source
        run: |
          mkdir -p FWJZUltraIsland
          
          # 1. TẠO FILE NHẠC MP3 MẪU TRỰC TIẾP QUA BỘ TỔNG HỢP ÂM THANH MACOS
          echo "Generating real offline MP3 track..."
          say -v "Samantha" "FWJZ Cyber Dynamic Island Activated. Playing background cyberpunk lo-fi music." -o FWJZUltraIsland/sample.aiff
          afconvert -f MP4F -d aac FWJZUltraIsland/sample.aiff FWJZUltraIsland/music.mp3
          rm FWJZUltraIsland/sample.aiff

          # 2. MÃ NGUỒN OBJECTIVE-C ĐIỀU KHIỂN NHẠC THẬT BẰNG AVFOUNDATION
          cat << 'EOF' > FWJZUltraIsland/main.m
          #import <UIKit/UIKit.h>
          #import <QuartzCore/QuartzCore.h>
          #import <AVFoundation/AVFoundation.h>

          @interface UltraIslandController : UIViewController <AVAudioPlayerDelegate>
          @property (nonatomic, strong) UIView *islandContainer;
          @property (nonatomic, strong) UIView *compactLeading;
          @property (nonatomic, strong) UIView *compactTrailing;
          @property (nonatomic, strong) UIView *expandedContent;
          @property (nonatomic, strong) UILabel *lblBattery;
          @property (nonatomic, strong) UILabel *lblStatus;
          @property (nonatomic, strong) UIButton *btnPlay;
          @property (nonatomic, strong) NSMutableArray<UIView *> *waveBars;
          @property (nonatomic, strong) AVAudioPlayer *audioPlayer;
          @property (nonatomic, assign) BOOL isExpanded;
          @property (nonatomic, assign) BOOL isPlaying;
          @end

          @implementation UltraIslandController

          - (BOOL)prefersStatusBarHidden {
              return NO;
          }

          - (UIStatusBarStyle)preferredStatusBarStyle {
              return UIStatusBarStyleLightContent;
          }

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor blackColor];
              self.isExpanded = NO;
              self.isPlaying = NO;
              self.waveBars = [NSMutableArray array];

              [UIDevice currentDevice].batteryMonitoringEnabled = YES;

              // Thiết lập Audio Session chạy ngầm
              [[AVAudioSession sharedInstance] setCategory:AVAudioSessionCategoryPlayback error:nil];
              [[AVAudioSession sharedInstance] setActive:YES error:nil];

              // Nạp file nhạc MP3 trong Bundle
              NSString *musicPath = [[NSBundle mainBundle] pathForResource:@"music" ofType:@"mp3"];
              if (musicPath) {
                  NSURL *url = [NSURL fileURLWithPath:musicPath];
                  self.audioPlayer = [[AVAudioPlayer alloc] initWithContentsOfURL:url error:nil];
                  self.audioPlayer.numberOfLoops = -1; // Lặp lại vô tận
                  [self.audioPlayer prepareToPlay];
              }

              CGFloat sw = self.view.bounds.size.width;

              // Tọa độ chuẩn xác cho iPhone 11 Pro Max
              self.islandContainer = [[UIView alloc] initWithFrame:CGRectMake((sw - 126) / 2.0, 46, 126, 36)];
              self.islandContainer.backgroundColor = [UIColor blackColor];
              self.islandContainer.layer.cornerRadius = 18.0;
              self.islandContainer.layer.masksToBounds = YES;
              self.islandContainer.layer.borderWidth = 0.5;
              self.islandContainer.layer.borderColor = [UIColor colorWithWhite:0.25 alpha:0.6].CGColor;
              [self.view addSubview:self.islandContainer];

              // --- COMPACT VIEW (Thu nhỏ) ---
              self.compactLeading = [[UIView alloc] initWithFrame:CGRectMake(10, 9, 18, 18)];
              UIImageView *iconMusic = [[UIImageView alloc] initWithFrame:self.compactLeading.bounds];
              iconMusic.image = [UIImage systemImageNamed:@"waveform"];
              iconMusic.tintColor = [UIColor cyanColor];
              [self.compactLeading addSubview:iconMusic];
              [self.islandContainer addSubview:self.compactLeading];

              self.compactTrailing = [[UIView alloc] initWithFrame:CGRectMake(126 - 38, 9, 30, 18)];
              UILabel *lblMiniBat = [[UILabel alloc] initWithFrame:self.compactTrailing.bounds];
              NSInteger batPct = (NSInteger)([UIDevice currentDevice].batteryLevel * 100);
              if (batPct < 0) batPct = 85;
              lblMiniBat.text = [NSString stringWithFormat:@"%ld%%", (long)batPct];
              lblMiniBat.textColor = [UIColor colorWithRed:0.2 green:0.9 blue:0.4 alpha:1.0];
              lblMiniBat.font = [UIFont boldSystemFontOfSize:10.5];
              lblMiniBat.textAlignment = NSTextAlignmentRight;
              [self.compactTrailing addSubview:lblMiniBat];
              [self.islandContainer addSubview:self.compactTrailing];

              // --- EXPANDED VIEW (Bung to) ---
              self.expandedContent = [[UIView alloc] initWithFrame:CGRectMake(0, 0, sw - 32, 185)];
              self.expandedContent.alpha = 0.0;
              [self.islandContainer addSubview:self.expandedContent];

              // Icon Album
              UIView *artBox = [[UIView alloc] initWithFrame:CGRectMake(16, 16, 52, 52)];
              artBox.backgroundColor = [UIColor colorWithRed:0.1 green:0.12 blue:0.18 alpha:1.0];
              artBox.layer.cornerRadius = 12.0;
              artBox.layer.borderWidth = 1.0;
              artBox.layer.borderColor = [UIColor cyanColor].CGColor;
              [self.expandedContent addSubview:artBox];

              UILabel *artLogo = [[UILabel alloc] initWithFrame:artBox.bounds];
              artLogo.text = @"🎧";
              artLogo.font = [UIFont systemFontOfSize:24];
              artLogo.textAlignment = NSTextAlignmentCenter;
              [artBox addSubview:artLogo];

              // Thông tin bài hát
              UILabel *titleSong = [[UILabel alloc] initWithFrame:CGRectMake(78, 16, sw - 125, 20)];
              titleSong.text = @"FWJZ Cyber Chill Track";
              titleSong.textColor = [UIColor whiteColor];
              titleSong.font = [UIFont boldSystemFontOfSize:14.5];
              [self.expandedContent addSubview:titleSong];

              self.lblStatus = [[UILabel alloc] initWithFrame:CGRectMake(78, 38, sw - 125, 16)];
              self.lblStatus.text = [NSString stringWithFormat:@"Pin: %ld%% • Sẵn sàng phát", (long)batPct];
              self.lblStatus.textColor = [UIColor colorWithWhite:0.6 alpha:1.0];
              self.lblStatus.font = [UIFont systemFontOfSize:11.5];
              [self.expandedContent addSubview:self.lblStatus];

              // Dải sóng nhạc chuyển động
              CGFloat startX = 16.0;
              for (int i = 0; i < 16; i++) {
                  UIView *bar = [[UIView alloc] initWithFrame:CGRectMake(startX + (i * 18), 82, 6, 16)];
                  bar.backgroundColor = [UIColor colorWithRed:0.0 green:0.9 blue:1.0 alpha:1.0];
                  bar.layer.cornerRadius = 3.0;
                  [self.expandedContent addSubview:bar];
                  [self.waveBars addObject:bar];
              }

              // Cụm nút điều khiển nhạc thật (Play / Pause)
              self.btnPlay = [UIButton buttonWithType:UIButtonTypeCustom];
              self.btnPlay.frame = CGRectMake((sw - 32 - 120) / 2.0, 118, 120, 42);
              self.btnPlay.backgroundColor = [UIColor colorWithRed:0.12 green:0.18 blue:0.32 alpha:0.9];
              self.btnPlay.layer.cornerRadius = 21.0;
              self.btnPlay.layer.borderWidth = 1.0;
              self.btnPlay.layer.borderColor = [UIColor cyanColor].CGColor;
              [self.btnPlay setTitle:@"▶ PHÁT NHẠC" forState:UIControlStateNormal];
              [self.btnPlay setTitleColor:[UIColor cyanColor] forState:UIControlStateNormal];
              self.btnPlay.titleLabel.font = [UIFont boldSystemFontOfSize:13];
              [self.btnPlay addTarget:self action:@selector(togglePlayback) forControlEvents:UIControlEventTouchUpInside];
              [self.expandedContent addSubview:self.btnPlay];

              // Tap Gesture bung đảo
              UITapGestureRecognizer *tap = [[UITapGestureRecognizer alloc] initWithTarget:self action:@selector(toggleIsland)];
              [self.islandContainer addGestureRecognizer:tap];
          }

          - (void)togglePlayback {
              UIImpactFeedbackGenerator *feed = [[UIImpactFeedbackGenerator alloc] initWithStyle:UIImpactFeedbackStyleMedium];
              [feed impactOccurred];

              if (!self.audioPlayer) return;

              if (self.isPlaying) {
                  [self.audioPlayer pause];
                  self.isPlaying = NO;
                  [self.btnPlay setTitle:@"▶ PHÁT NHẠC" forState:UIControlStateNormal];
                  self.lblStatus.text = @"Đã tạm dừng bài hát";
                  [self stopWaveAnimations];
              } else {
                  [self.audioPlayer play];
                  self.isPlaying = YES;
                  [self.btnPlay setTitle:@"⏸ TẠM DỪNG" forState:UIControlStateNormal];
                  self.lblStatus.text = @"Đang phát nhạc offline...";
                  [self startWaveAnimations];
              }
          }

          - (void)startWaveAnimations {
              for (int i = 0; i < self.waveBars.count; i++) {
                  UIView *bar = self.waveBars[i];
                  [bar.layer removeAllAnimations];

                  CABasicAnimation *anim = [CABasicAnimation animationWithKeyPath:@"transform.scale.y"];
                  anim.duration = 0.35 + (i % 4) * 0.12;
                  anim.fromValue = @(0.3);
                  anim.toValue = @(2.0);
                  anim.autoreverses = YES;
                  anim.repeatCount = HUGE_VALF;
                  [bar.layer addAnimation:anim forKey:@"waveScale"];
              }
          }

          - (void)stopWaveAnimations {
              for (UIView *bar in self.waveBars) {
                  [bar.layer removeAllAnimations];
              }
          }

          - (void)toggleIsland {
              UIImpactFeedbackGenerator *haptic = [[UIImpactFeedbackGenerator alloc] initWithStyle:UIImpactFeedbackStyleRigid];
              [haptic impactOccurred];

              CGFloat sw = self.view.bounds.size.width;
              self.isExpanded = !self.isExpanded;

              CGRect targetFrame;
              CGFloat targetRadius;

              if (self.isExpanded) {
                  targetFrame = CGRectMake(16, 46, sw - 32, 185);
                  targetRadius = 28.0;
              } else {
                  targetFrame = CGRectMake((sw - 126) / 2.0, 46, 126, 36);
                  targetRadius = 18.0;
              }

              [UIView animateWithDuration:0.52
                                    delay:0
                   usingSpringWithDamping:0.72
                    initialSpringVelocity:0.3
                                  options:UIViewAnimationOptionCurveEaseInOut
                               animations:^{
                  self.islandContainer.frame = targetFrame;
                  self.islandContainer.layer.cornerRadius = targetRadius;
                  self.compactLeading.alpha = self.isExpanded ? 0.0 : 1.0;
                  self.compactTrailing.alpha = self.isExpanded ? 0.0 : 1.0;
                  self.expandedContent.alpha = self.isExpanded ? 1.0 : 0.0;
              } completion:nil];
          }
          @end

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
              self.window.rootViewController = [[UltraIslandController alloc] init];
              [self.window makeKeyAndVisible];
              return YES;
          }
          @end

          int main(int argc, char * argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
          EOF

          # 3. INFO.PLIST CHUẨN CÓ HỖ TRỢ CHẠY NHẠC NGẦN (BACKGROUND AUDIO)
          cat << 'EOF' > FWJZUltraIsland/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>vi</string>
              <key>CFBundleExecutable</key>
              <string>FWJZUltraIsland</string>
              <key>CFBundleIdentifier</key>
              <string>com.fwjz.ultraisland</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>Dynamic Island</string>
              <key>CFBundleDisplayName</key>
              <string>Dynamic Music</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>2.0.0</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>CFBundleVersion</key>
              <string>2</string>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIBackgroundModes</key>
              <array>
                  <string>audio</string>
              </array>
              <key>DTPlatformName</key>
              <string>iphoneos</string>
              <key>DTSDKName</key>
              <string>iphoneos17.0</string>
              <key>CFBundleSupportedPlatforms</key>
              <array>
                  <string>iPhoneOS</string>
              </array>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Build and Package Island Music IPA
        run: |
          rm -rf Payload FWJZMusicIsland.ipa
          mkdir -p Payload/FWJZUltraIsland.app

          # Biên dịch Objective-C liên kết thư viện AVFoundation
          xcrun -sdk iphoneos clang -target arm64-apple-ios14.0 \
            -fobjc-arc -framework UIKit -framework Foundation -framework QuartzCore -framework AVFoundation \
            FWJZUltraIsland/main.m -o Payload/FWJZUltraIsland.app/FWJZUltraIsland

          chmod 755 Payload/FWJZUltraIsland.app/FWJZUltraIsland
          cp FWJZUltraIsland/Info.plist Payload/FWJZUltraIsland.app/
          cp FWJZUltraIsland/music.mp3 Payload/FWJZUltraIsland.app/
          touch Payload/FWJZUltraIsland.app/embedded.mobileprovision
          codesign --force --deep --sign - Payload/FWJZUltraIsland.app

          zip -qry FWJZMusicIsland.ipa Payload/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FWJZ-Music-Island-IPA
          path: FWJZMusicIsland.ipa
